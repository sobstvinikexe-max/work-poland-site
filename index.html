<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gov Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="container">
    <div class="logo">gov.pl</div>
    <nav>
      <a href="#">Usługi</a>
      <a href="#">Informacje</a>
      <a href="#">Kontakt</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1>Witamy na portalu usług publicznych</h1>
    <p>Znajdź najważniejsze informacje i usługi online.</p>
    <input type="text" placeholder="Szukaj usług...">
  </div>
</section>

<section class="services container">
  <div class="card">
    <h3>Dowód osobisty</h3>
    <p>Złóż wniosek online.</p>
  </div>
  <div class="card">
    <h3>Prawo jazdy</h3>
    <p>Sprawdź status dokumentu.</p>
  </div>
  <div class="card">
    <h3>Podatki</h3>
    <p>Rozlicz PIT online.</p>
  </div>
</section>

<footer>
  <div class="container">
    <p>© 2026 Gov Clone</p>
  </div>
</footer>

</body>
</html>
